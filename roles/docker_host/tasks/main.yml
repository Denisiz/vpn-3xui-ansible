---
- name: Install packages required before Torotin Docker step
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Explain Docker ownership
  ansible.builtin.debug:
    msg: "Docker Engine and Compose plugin are installed or reinstalled by Torotin installer step: script/install.sh run docker."
